<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Indonesian National Heroes — meet 6 heroes who shaped Indonesia. Bilingual history lesson." />
  <meta name="theme-color" content="#B91C1C" />
  <link rel="canonical" href="https://bayhaqy.my.id/kids/history/indonesian-heroes/" />
  <link rel="icon" type="image/png" href="/kids/icons/logo.png" />
  <title>Indonesian Heroes — Bayhaqy Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>(function(){try{var s=localStorage.getItem('bayhaqy-kids-theme');if(s==='dark'||s==='light'){document.documentElement.setAttribute('data-theme',s);}else{var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}}catch(e){}})();</script>
  <link rel="stylesheet" href="/kids/assets/theme.css?v=20260811a" />
  <style>
    .hero-card {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform .2s var(--ease), box-shadow .2s;
      cursor: pointer;
    }
    .hero-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--history);
    }
    .hero-card .portrait {
      width: 100%;
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem;
      background: linear-gradient(135deg, var(--hist-soft), var(--red-50));
    }
    .hero-card .body {
      padding: 1rem 1.25rem;
    }
    .hero-card h3 {
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }
    .hero-card .years {
      font-size: var(--fs-xs);
      color: var(--ink-mute);
      margin-bottom: 0.5rem;
    }
    .hero-card .summary {
      font-size: var(--fs-sm);
      color: var(--ink-soft);
    }
    .hero-card .badge {
      display: inline-block;
      background: var(--hist-soft);
      color: var(--history);
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: var(--fs-xs);
      font-weight: 700;
      margin-top: 0.4rem;
    }

    .hero-detail {
      background: var(--paper);
      border-left: 5px solid var(--history);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin: 1rem 0;
      display: none;
    }
    .hero-detail.show { display: block; animation: pop .3s; }
    .hero-detail h3 {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      color: var(--history);
      margin-bottom: 0.4rem;
    }
    .hero-detail .full-story {
      color: var(--ink-soft);
      line-height: 1.7;
      margin-top: 0.5rem;
    }
    .hero-detail .quote {
      background: var(--hist-soft);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin: 0.75rem 0;
      font-style: italic;
      color: var(--ink-soft);
    }
  </style>
</head>
<body data-app-name="Indonesian Heroes" data-subject="history" class="subject-page">
  <script src="/kids/assets/i18n.js"></script>
  <script src="/kids/assets/app-shell.js"></script>

  <main class="app-main">
    <div class="breadcrumbs">
      <a href="/kids/">Bayhaqy Kids</a>
      <span class="sep">›</span>
      <a href="/kids/history/">History</a>
      <span class="sep">›</span>
      <span>National Heroes</span>
    </div>

    <header class="app-hero">
      <span class="app-eyebrow">Grade 3 · Lesson</span>
      <h1 class="app-title">Indonesian <span class="accent">Heroes</span></h1>
      <p class="app-subtitle">Meet 6 brave people who helped Indonesia become free. Tap any hero to read their story.</p>
    </header>

    <div class="grid-2" id="heroGrid"></div>
    <div class="hero-detail" id="heroDetail"></div>
  </main>

  <script>
    var HEROES = [
      {
        emoji: '🗡️',
        name_en: 'Sultan Hasanuddin', name_id: 'Sultan Hasanuddin',
        years: '1631–1670',
        badge_en: 'King of Gowa', badge_id: 'Raja Gowa',
        summary_en: 'A king from South Sulawesi who fought Dutch traders for years before being defeated.',
        summary_id: 'Raja dari Sulawesi Selatan yang melawan Belanda bertahun-tahun sebelum akhirnya dikalahkan.',
        story_en: 'Sultan Hasanuddin was the 16th King of Gowa (in modern-day Makassar, South Sulawesi). When the Dutch East India Company (VOC) tried to control the spice trade in his region, he refused to surrender. He led a long resistance, building alliances with other kingdoms. The Dutch called him "The Rooster of the East" because he was so fierce in battle. He finally accepted peace in 1667, but never gave up his dignity.',
        story_id: 'Sultan Hasanuddin adalah Raja Gowa ke-16 (di Makassar, Sulawesi Selatan). Ketika VOC mencoba menguasai perdagangan rempah di wilayahnya, ia menolak menyerah. Ia memimpin perlawanan panjang, membangun aliansi dengan kerajaan lain. Belanda menjulukinya "Ayam Jantan dari Timur" karena kegigihannya. Ia akhirnya menerima perjanjian damai pada 1667, tetapi tidak pernah menyerah kehormatannya.',
        quote_en: 'It is better for us to die standing than to live kneeling.',
        quote_id: 'Lebih baik kita mati berdiri daripada hidup berlutut.'
      },
      {
        emoji: '✊',
        name_en: 'Cut Nyak Dien', name_id: 'Cut Nyak Dien',
        years: '1848–1908',
        badge_en: 'Aceh Warrior', badge_id: 'Pejuang Aceh',
        summary_en: 'A woman warrior from Aceh who led fighters against the Dutch for 25 years.',
        summary_id: 'Prajurit wanita dari Aceh yang memimpin pejuang melawan Belanda selama 25 tahun.',
        story_en: 'Cut Nyak Dien was born into an Acehnese noble family. When the Dutch attacked Aceh in 1873, she joined the resistance after her husband was killed in battle. She led guerrilla fighters in the forests for decades, even when she grew old and blind. Finally captured in 1908, she was exiled to West Java where she died. She is a symbol of women\u2019s courage in Indonesia.',
        story_id: 'Cut Nyak Dien lahir dari keluarga bangsawan Aceh. Ketika Belanda menyerang Aceh pada 1873, ia bergabung dengan perlawanan setelah suaminya gugur. Ia memimpin pejuang gerilya di hutan selama puluhan tahun, bahkan ketika sudah tua dan buta. Akhirnya ditangkap pada 1908, ia diasingkan ke Jawa Barat dan meninggal di sana. Ia menjadi simbol keberanian wanita Indonesia.',
        quote_en: 'As long as the Dutch are still in Aceh, we must keep fighting.',
        quote_id: 'Selama Belanda masih di Aceh, kita harus terus berjuang.'
      },
      {
        emoji: '✍️',
        name_en: 'Ki Hajar Dewantara', name_id: 'Ki Hajar Dewantara',
        years: '1889–1959',
        badge_en: 'Father of Indonesian Education', badge_id: 'Bapak Pendidikan Indonesia',
        summary_en: 'Founded the Taman Siswa school movement and shaped Indonesia\u2019s education system.',
        summary_id: 'Mendirikan perguruan Taman Siswa dan merancang sistem pendidikan Indonesia.',
        story_en: 'Born Raden Mas Soewardi Soerjaningrat, he changed his name to Ki Hajar Dewantara to be closer to the people. He founded Taman Siswa in 1922 — a school for Indonesian children at a time when Dutch schools were only for the elite. After independence, he became the first Minister of Education. His birthday, May 2nd, is now National Education Day in Indonesia. His famous motto: "Ing Ngarsa Sung Tuladha, Ing Madya Mangun Karsa, Tut Wuri Handayani" — leading from the front, inspiring in the middle, supporting from behind.',
        story_id: 'Lahir dengan nama Raden Mas Soewardi Soerjaningrat, ia mengganti namanya menjadi Ki Hajar Dewantara agar lebih dekat dengan rakyat. Ia mendirikan Taman Siswa pada 1922 — sekolah untuk anak-anak Indonesia di saat sekolah Belanda hanya untuk kalangan elite. Setelah kemerdekaan, ia menjadi Menteri Pendidikan pertama. Ulang tahunnya, 2 Mei, kini menjadi Hari Pendidikan Nasional. Semboyannya: "Ing Ngarsa Sung Tuladha, Ing Madya Mangun Karsa, Tut Wuri Handayani" — di depan memberi teladan, di tengah membangun semangat, di belakang memberi dorongan.',
        quote_en: 'Ing Ngarsa Sung Tuladha, Ing Madya Mangun Karsa, Tut Wuri Handayani.',
        quote_id: 'Ing Ngarsa Sung Tuladha, Ing Madya Mangun Karsa, Tut Wuri Handayani.'
      },
      {
        emoji: '📜',
        name_en: 'RA Kartini', name_id: 'RA Kartini',
        years: '1879–1904',
        badge_en: 'Women\u2019s Rights Pioneer', badge_id: 'Pelopor Hak Wanita',
        summary_en: 'Wrote letters that awakened Indonesia to women\u2019s rights and education.',
        summary_id: 'Menulis surat yang menyadarkan Indonesia tentang hak dan pendidikan wanita.',
        story_en: 'Raden Adjeng Kartini was born into Javanese nobility. Although she could only attend Dutch school until age 12, she kept reading and writing letters to friends in the Netherlands. Her letters, later published as "Door Duisternis tot Licht" (Out of Darkness Comes Light), called for women\u2019s education and equality. She died young at 25, but her ideas lived on. Her birthday, April 21st, is Kartini Day — when Indonesians celebrate women\u2019s achievements.',
        story_id: 'Raden Adjeng Kartini lahir dari keluarga bangsawan Jawa. Meskipun hanya bisa sekolah Belanda sampai usia 12 tahun, ia terus membaca dan menulis surat kepada teman-teman di Belanda. Suratnya, kemudian diterbitkan sebagai "Habis Gelap Terbitlah Terang", menuntut pendidikan dan kesetaraan wanita. Ia meninggal muda pada usia 25 tahun, tetapi idenya hidup. Ulang tahunnya, 21 April, menjadi Hari Kartini — saat orang Indonesia merayakan pencapaian wanita.',
        quote_en: 'After darkness comes light.',
        quote_id: 'Habis gelap terbitlah terang.'
      },
      {
        emoji: '⚔️',
        name_en: 'General Sudirman', name_id: 'Jenderal Sudirman',
        years: '1916–1950',
        badge_en: 'First Commander of TNI', badge_id: 'Panglima TNI Pertama',
        summary_en: 'Led Indonesia\u2019s young army against the Dutch after independence.',
        summary_id: 'Memimpin pasukan muda Indonesia melawan Belanda setelah kemerdekaan.',
        story_en: 'Sudirman was only 29 when he became the first Commander of the Indonesian Armed Forces (TNI). When the Dutch attacked the new Republic in 1948, he was already sick with tuberculosis. Despite being carried on a stretcher, he led his soldiers in a long guerrilla campaign through the mountains of Java. His determination inspired the troops to keep fighting. He died in 1950, just months after the Dutch recognized Indonesian independence, but is honored as a founding father of the military.',
        story_id: 'Sudirman baru berusia 29 tahun ketika menjadi Panglima Tentara Nasional Indonesia (TNI) pertama. Ketika Belanda menyerang Republik baru pada 1948, ia sudah sakit parah (TBC). Meski digendong dengan tandu, ia memimpin prajurit dalam kampanye gerilya panjang di pegunungan Jawa. Determinasinya menginspirasi pasukan untuk terus berjuang. Ia meninggal pada 1950, beberapa bulan setelah Belanda mengakui kemerdekaan Indonesia, dan dihormati sebagai bapak militer.',
        quote_en: 'I ordered you to fight, but more important than that — I ordered you to defend the honor of the Republic.',
        quote_id: 'Saya perintahkan kalian untuk berperang, tetapi lebih penting dari itu — saya perintahkan kalian mempertahankan kehormatan Republik.'
      },
      {
        emoji: '🎤',
        name_en: 'Bung Tomo', name_id: 'Bung Tomo',
        years: '1920–1981',
        badge_en: 'Hero of Surabaya', badge_id: 'Pahlawan Surabaya',
        summary_en: 'His speeches fired up Indonesians to fight in the Battle of Surabaya (1945).',
        summary_id: 'Pidatonya mengobarkan semangat rakyat untuk berperang di Pertempuran Surabaya (1945).',
        story_en: 'Sutomo, known as Bung Tomo, was a young orator in Surabaya when British troops demanded Indonesian fighters surrender in October 1945. His fiery radio broadcasts — especially his famous "Allahu Akbar" speech — rallied thousands of ordinary Indonesians to fight in the Battle of Surabaya on November 10, 1945. Although the battle was lost, it became a symbol of Indonesian resistance. November 10th is now Heroes\u2019 Day (Hari Pahlawan) in Indonesia.',
        story_id: 'Sutomo, dikenal sebagai Bung Tomo, adalah orator muda di Surabaya ketika pasukan Inggris menuntut pejuang Indonesia menyerah pada Oktober 1945. Siaran radio berapinya — terutama pidato "Allahu Akbar" yang terkenal — mengobarkan ribuan rakyat biasa untuk berperang di Pertempuran Surabaya pada 10 November 1945. Meski pertempuran kalah, ini menjadi simbol perlawanan Indonesia. Tanggal 10 November kini menjadi Hari Pahlawan di Indonesia.',
        quote_en: 'Freedom or death!',
        quote_id: 'Merdeka atau mati!'
      }
    ];

    var grid = document.getElementById('heroGrid');
    var detail = document.getElementById('heroDetail');

    function renderGrid() {
      var lang = window.getLang();
      grid.innerHTML = '';
      HEROES.forEach(function (h, idx) {
        var card = document.createElement('div');
        card.className = 'hero-card';
        card.innerHTML =
          '<div class="portrait">' + h.emoji + '</div>' +
          '<div class="body">' +
            '<h3>' + (lang === 'id' ? h.name_id : h.name_en) + '</h3>' +
            '<div class="years">' + h.years + '</div>' +
            '<div class="summary">' + (lang === 'id' ? h.summary_id : h.summary_en) + '</div>' +
            '<span class="badge">' + (lang === 'id' ? h.badge_id : h.badge_en) + '</span>' +
          '</div>';
        card.addEventListener('click', function () { showDetail(idx); });
        grid.appendChild(card);
      });
    }

    function showDetail(idx) {
      var lang = window.getLang();
      var h = HEROES[idx];
      detail.innerHTML =
        '<h3>' + h.emoji + ' ' + (lang === 'id' ? h.name_id : h.name_en) + '</h3>' +
        '<div class="years">' + h.years + ' · ' + (lang === 'id' ? h.badge_id : h.badge_en) + '</div>' +
        '<div class="quote">"' + (lang === 'id' ? h.quote_id : h.quote_en) + '"</div>' +
        '<p class="full-story">' + (lang === 'id' ? h.story_id : h.story_en) + '</p>';
      detail.classList.add('show');
      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.addEventListener('langchange', renderGrid);
    renderGrid();
  </script>
</body>
</html>
