<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Games lessons for kids K-9. Bilingual (English & Indonesian), interactive, 100% free. Aligned with Singapore Primary, Cambridge, IB, IPC, Montessori." />
  <meta name="theme-color" content="#B91C1C" />
  <meta property="og:title" content="Games — Bayhaqy Kids" />
  <meta property="og:description" content="Bilingual Games lessons for kids K-9." />
  <meta property="og:url" content="https://bayhaqy.my.id/kids/games/" />
  <link rel="canonical" href="https://bayhaqy.my.id/kids/games/" />
  <link rel="icon" type="image/png" href="/kids/icons/logo.png" />
  <title>Games — Bayhaqy Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>(function(){try{var s=localStorage.getItem('bayhaqy-kids-theme');if(s==='dark'||s==='light'){document.documentElement.setAttribute('data-theme',s);}else{var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}}catch(e){}})();</script>
  <link rel="stylesheet" href="/kids/assets/theme.css?v=20260811b" />
</head>
<body data-app-name="Games" data-subject="games" class="subject-page">
  <script src="/kids/assets/i18n.js"></script>
  <script src="/kids/assets/app-shell.js"></script>

  <main class="app-main">
    <div class="breadcrumbs">
      <a href="/kids/" data-i18n="back_to_kids">Bayhaqy Kids</a>
      <span class="sep">›</span>
      <span data-i18n="nav_games">Games</span>
    </div>

    <header class="app-hero">
      <div class="subject-icon-big">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
      </div>
      <span class="app-eyebrow" data-i18n="nav_games">Games</span>
      <h1 class="app-title">Play and <span class="accent">learn</span></h1>
      <p class="app-subtitle" data-i18n="subject_games_desc">Practice what you learned through fun, interactive games.</p>
    </header>

    <section class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem;">
        <div>
          <strong style="font-family: var(--font-display);" data-i18n="grade_label">Grade level</strong>
          <div style="font-size: var(--fs-xs); color: var(--ink-mute);" data-i18n="lessons_sub">Pick a topic to start learning.</div>
        </div>
        <div class="grade-selector" id="gradeSelector" style="flex-wrap:wrap;">
          <button class="grade-btn active" data-grade="all" data-i18n="grade_all">All</button>
          <button class="grade-btn" data-grade="K">K</button>
          <button class="grade-btn" data-grade="1">G1</button>
          <button class="grade-btn" data-grade="2">G2</button>
          <button class="grade-btn" data-grade="3">G3</button>
          <button class="grade-btn" data-grade="4">G4</button>
          <button class="grade-btn" data-grade="5">G5</button>
          <button class="grade-btn" data-grade="6">G6</button>
          <button class="grade-btn" data-grade="7">G7</button>
          <button class="grade-btn" data-grade="8">G8</button>
          <button class="grade-btn" data-grade="9">G9</button>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:0.75rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem;">
        <div>
          <strong style="font-family: var(--font-display);" data-i18n="curriculum_label">Curriculum</strong>
          <div style="font-size: var(--fs-xs); color: var(--ink-mute);">SPC · Cambridge · IB · IPC · Montessori · ID</div>
        </div>
        <div class="grade-selector" id="currSelector" style="flex-wrap:wrap;">
          <button class="grade-btn active" data-curr="all" data-i18n="grade_all">All</button>
          <button class="grade-btn" data-curr="spc">SPC</button>
          <button class="grade-btn" data-curr="cambridge">Cambridge</button>
          <button class="grade-btn" data-curr="ib">IB</button>
          <button class="grade-btn" data-curr="ipc">IPC</button>
          <button class="grade-btn" data-curr="montessori">Montessori</button>
          <button class="grade-btn" data-curr="id">ID</button>
        </div>
      </div>
    </section>

    <h2 style="font-family: var(--font-display); font-size: var(--fs-xl); margin: 1.5rem 0 0.5rem;" data-i18n="lessons_title">Lessons</h2>
    <div class="lesson-list" id="lessonList"></div>
  </main>

  <script src="/kids/assets/lessons.js"></script>
  <script>
    var list = document.getElementById('lessonList');
    var gradeBtns = document.querySelectorAll('#gradeSelector .grade-btn');
    var currBtns = document.querySelectorAll('#currSelector .grade-btn');
    var currentGrade = 'all';
    var currentCurr = 'all';
    function rerender() { window.renderLessons(list, 'games', currentGrade, currentCurr); }
    gradeBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        gradeBtns.forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        currentGrade = b.getAttribute('data-grade');
        rerender();
      });
    });
    currBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        currBtns.forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        currentCurr = b.getAttribute('data-curr');
        rerender();
      });
    });
    document.addEventListener('langchange', rerender);
    rerender();
  </script>
</body>
</html>
