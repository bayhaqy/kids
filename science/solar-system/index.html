<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Solar System Tour — fly through the 8 planets. Interactive simulation with planet facts. Bilingual science lesson." />
  <meta name="theme-color" content="#B91C1C" />
  <link rel="canonical" href="https://bayhaqy.my.id/kids/science/solar-system/" />
  <link rel="icon" type="image/png" href="/kids/icons/logo.png" />
  <title>Solar System — Bayhaqy Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>(function(){try{var s=localStorage.getItem('bayhaqy-kids-theme');if(s==='dark'||s==='light'){document.documentElement.setAttribute('data-theme',s);}else{var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light');}}catch(e){}})();</script>
  <link rel="stylesheet" href="/kids/assets/theme.css?v=20260829a" />
  <link rel="stylesheet" href="/kids/assets/lesson-kit.css?v=20260829a" />
  <style>
    .canvas-wrap {
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #000000 100%);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      margin: 1rem 0;
      box-shadow: var(--shadow);
    }
    canvas { display: block; width: 100%; height: 500px; cursor: pointer; }
    @media (max-width: 640px) { canvas { height: 380px; } }

    .planet-info {
      background: var(--paper);
      border: 2px solid var(--science);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin: 1rem 0;
      transition: border-color .3s;
    }
    .planet-info h3 {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      color: var(--science);
      margin-bottom: 0.5rem;
    }
    .planet-info .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .planet-info .fact {
      background: var(--sci-soft);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: var(--fs-sm);
    }
    .planet-info .fact .k { color: var(--ink-mute); font-weight: 600; display: block; font-size: var(--fs-xs); }
    .planet-info .fact .v { color: var(--ink); font-weight: 700; }
    .planet-info .desc { color: var(--ink-soft); margin-top: 0.5rem; }

    .controls {
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
      margin: 1rem 0;
    }
  </style>
</head>
<body data-app-name="Solar System" data-subject="science" class="subject-page">
  <script src="/kids/assets/i18n.js"></script>
  <script src="/kids/assets/app-shell.js"></script>
  <script src="/kids/assets/lessons.js?v=20260829a"></script>
  <script src="/kids/assets/lesson-kit.js?v=20260829a"></script>

  <main class="app-main">
    <div class="breadcrumbs">
      <a href="/kids/">Bayhaqy Kids</a>
      <span class="sep">›</span>
      <a href="/kids/science/">Science</a>
      <span class="sep">›</span>
      <span>Solar System Tour</span>
    </div>

    <header class="app-hero">
      <span class="app-eyebrow">Grade 3 · Simulation</span>
      <h1 class="app-title">Solar System <span class="accent">Tour</span></h1>
      <p class="app-subtitle">Click any planet to learn about it. Watch them orbit the Sun — Mercury is fastest, Neptune is slowest.</p>
    </header>

    <section class="card">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
      <div class="controls">
        <label style="font-size: var(--fs-sm); font-weight: 600;">
          <span>Speed</span>
          <input type="range" id="speed" min="0" max="100" value="50" style="accent-color: var(--science);" />
        </label>
        <button class="btn btn-ghost" id="pauseBtn">⏸ Pause</button>
        <span class="text-sm text-mute" style="margin-left: auto;">👆 Tap a planet</span>
      </div>
    </section>

    <section class="planet-info" id="planetInfo">
      <h3 id="pName">The Sun ☀️</h3>
      <p class="desc" id="pDesc">Click on any planet to learn about it!</p>
    </section>
  </main>

  <script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var speedEl = document.getElementById('speed');
    var pauseBtn = document.getElementById('pauseBtn');
    var pName = document.getElementById('pName');
    var pDesc = document.getElementById('pDesc');

    var W, H, dpr = window.devicePixelRatio || 1;
    function resize() {
      var rect = canvas.getBoundingClientRect();
      W = rect.width; H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    var PLANETS = [
      { name: 'Mercury', emoji: '☿', color: '#A9A9A9', radius: 4, orbit: 60,  speed: 4.15, facts: { 'Diameter': '4,879 km', 'Day length': '59 Earth days', 'Year': '88 Earth days', 'Moons': '0' }, desc_en: 'The smallest planet, closest to the Sun. Very hot in the day, very cold at night.', desc_id: 'Planet terkecil, terdekat dengan Matahari. Sangat panas di siang hari, sangat dingin di malam hari.' },
      { name: 'Venus',   emoji: '♀', color: '#FFD700', radius: 7, orbit: 95,  speed: 1.62, facts: { 'Diameter': '12,104 km', 'Day length': '243 Earth days', 'Year': '225 Earth days', 'Moons': '0' }, desc_en: 'The hottest planet — its thick atmosphere traps heat. About the same size as Earth.', desc_id: 'Planet terpanas — atmosfer tebalnya memerangkap panas. Ukurannya hampir sama dengan Bumi.' },
      { name: 'Earth',   emoji: '⊕', color: '#4A90E2', radius: 8, orbit: 135, speed: 1.00, facts: { 'Diameter': '12,742 km', 'Day length': '24 hours', 'Year': '365.25 days', 'Moons': '1' }, desc_en: 'Our home! The only planet we know with life — water, oxygen, and millions of species.', desc_id: 'Rumah kita! Satu-satunya planet yang kita tahu memiliki kehidupan — air, oksigen, dan jutaan spesies.' },
      { name: 'Mars',    emoji: '♂', color: '#CD5C5C', radius: 5, orbit: 180, speed: 0.53, facts: { 'Diameter': '6,779 km', 'Day length': '24h 37m', 'Year': '687 Earth days', 'Moons': '2' }, desc_en: 'The Red Planet — rusty iron in its soil makes it red. Robots are exploring it right now!', desc_id: 'Planet Merah — besi berkarat di tanahnya membuatnya merah. Robot sedang menjelajahinya sekarang!' },
      { name: 'Jupiter', emoji: '♃', color: '#D2691E', radius: 22, orbit: 245, speed: 0.084, facts: { 'Diameter': '139,820 km', 'Day length': '9h 56m', 'Year': '12 Earth years', 'Moons': '95' }, desc_en: 'The biggest planet — a gas giant with a giant red storm bigger than Earth.', desc_id: 'Planet terbesar — raksasa gas dengan badai merah raksasa yang lebih besar dari Bumi.' },
      { name: 'Saturn',  emoji: '♄', color: '#F4D03F', radius: 18, orbit: 310, speed: 0.034, facts: { 'Diameter': '116,460 km', 'Day length': '10h 42m', 'Year': '29 Earth years', 'Moons': '146' }, desc_en: 'Famous for its beautiful rings made of ice and rock.', desc_id: 'Terkenal dengan cincin indah yang terbuat dari es dan batu.' },
      { name: 'Uranus',  emoji: '♅', color: '#5DADE2', radius: 13, orbit: 365, speed: 0.012, facts: { 'Diameter': '50,724 km', 'Day length': '17h 14m', 'Year': '84 Earth years', 'Moons': '27' }, desc_en: 'An ice giant that rotates on its side — like a rolling ball!', desc_id: 'Raksasa es yang berputar miring — seperti bola berguling!' },
      { name: 'Neptune', emoji: '♆', color: '#3498DB', radius: 12, orbit: 415, speed: 0.006, facts: { 'Diameter': '49,244 km', 'Day length': '16h 6m', 'Year': '165 Earth years', 'Moons': '14' }, desc_en: 'The windiest planet — supersonic winds blow across its blue clouds.', desc_id: 'Planet paling berangin — angin supersonik meniup awan birunya.' }
    ];

    var t = 0;
    var paused = false;
    var stars = [];
    var hoveredPlanet = null;
    var selectedPlanet = null;

    // Generate stars
    for (var i = 0; i < 100; i++) {
      stars.push({ x: Math.random() * 800, y: Math.random() * 500, r: Math.random() * 1.2, tw: Math.random() * Math.PI * 2 });
    }

    function getCenter() { return { x: W / 2, y: H / 2 }; }
    function getPlanetPos(p, i) {
      var c = getCenter();
      var scale = Math.min(W, H) / 1000;
      var orbit = p.orbit * scale * 1.3;
      var angle = t * p.speed * 0.005 + i * 0.7;
      return { x: c.x + Math.cos(angle) * orbit, y: c.y + Math.sin(angle) * orbit * 0.6, r: p.radius * scale * 1.8 };
    }

    function draw() {
      // Background — already styled via CSS gradient
      ctx.fillStyle = '#000010';
      ctx.fillRect(0, 0, W, H);

      // Stars
      stars.forEach(function (s) {
        s.tw += 0.02;
        var a = 0.4 + Math.sin(s.tw) * 0.3;
        ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
        ctx.beginPath();
        ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      var c = getCenter();

      // Orbits
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      PLANETS.forEach(function (p, i) {
        var scale = Math.min(W, H) / 1000;
        var orbit = p.orbit * scale * 1.3;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, orbit, orbit * 0.6, 0, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Sun
      var sunGrad = ctx.createRadialGradient(c.x, c.y, 5, c.x, c.y, 30);
      sunGrad.addColorStop(0, '#FFFF00');
      sunGrad.addColorStop(0.5, '#FFA500');
      sunGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 30, 0, Math.PI * 2);
      ctx.fill();

      // Planets
      PLANETS.forEach(function (p, i) {
        var pos = getPlanetPos(p, i);
        var r = Math.max(3, pos.r);

        // Glow on hover/selected
        if (selectedPlanet === p || hoveredPlanet === p) {
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, r * 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
        ctx.fill();

        // Saturn's rings
        if (p.name === 'Saturn') {
          ctx.strokeStyle = '#E5C16E';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(pos.x, pos.y, r * 1.8, r * 0.5, 0.3, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Label on hover
        if (hoveredPlanet === p) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px Nunito, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.name, pos.x, pos.y - r - 8);
        }
      });
    }

    function step() {
      if (!paused) {
        var speedMul = parseInt(speedEl.value) / 50;
        t += speedMul;
      }
      draw();
      requestAnimationFrame(step);
    }

    canvas.addEventListener('mousemove', function (e) {
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      hoveredPlanet = null;
      for (var i = 0; i < PLANETS.length; i++) {
        var pos = getPlanetPos(PLANETS[i], i);
        var d = Math.hypot(mx - pos.x, my - pos.y);
        if (d < pos.r + 6) { hoveredPlanet = PLANETS[i]; canvas.style.cursor = 'pointer'; break; }
      }
      if (!hoveredPlanet) canvas.style.cursor = 'default';
    });

    canvas.addEventListener('click', function (e) {
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      // Check Sun first
      var c = getCenter();
      if (Math.hypot(mx - c.x, my - c.y) < 30) {
        selectedPlanet = null;
        showSunInfo();
        return;
      }
      for (var i = 0; i < PLANETS.length; i++) {
        var pos = getPlanetPos(PLANETS[i], i);
        if (Math.hypot(mx - pos.x, my - pos.y) < pos.r + 6) {
          selectedPlanet = PLANETS[i];
          showPlanetInfo(PLANETS[i]);
          break;
        }
      }
    });

    canvas.addEventListener('touchstart', function (e) {
      var rect = canvas.getBoundingClientRect();
      var t = e.touches[0];
      var mx = t.clientX - rect.left;
      var my = t.clientY - rect.top;
      for (var i = 0; i < PLANETS.length; i++) {
        var pos = getPlanetPos(PLANETS[i], i);
        if (Math.hypot(mx - pos.x, my - pos.y) < pos.r + 12) {
          selectedPlanet = PLANETS[i];
          showPlanetInfo(PLANETS[i]);
          break;
        }
      }
    });

    function showSunInfo() {
      var lang = window.getLang();
      pName.textContent = (lang === 'id' ? 'Matahari' : 'The Sun') + ' ☀️';
      var desc = lang === 'id'
        ? 'Sebintang bintang di pusat tata surya kita. Sangat besar — 1,3 juta Bumi bisa muat di dalamnya!'
        : 'A star at the center of our solar system. Huge — 1.3 million Earths could fit inside it!';
      var facts = lang === 'id'
        ? { 'Diameter': '1.39 juta km', 'Suhu permukaan': '5,500°C', 'Usia': '4.6 miliar tahun', 'Tipe': 'Bintang G' }
        : { 'Diameter': '1.39 million km', 'Surface temp': '5,500°C', 'Age': '4.6 billion years', 'Type': 'G-type star' };
      renderInfo(desc, facts);
    }

    function showPlanetInfo(p) {
      var lang = window.getLang();
      pName.textContent = p.name + ' ' + p.emoji;
      var desc = lang === 'id' ? p.desc_id : p.desc_en;
      renderInfo(desc, p.facts);
    }

    function renderInfo(desc, facts) {
      var factsHtml = '';
      Object.keys(facts).forEach(function (k) {
        factsHtml += '<div class="fact"><span class="k">' + k + '</span><span class="v">' + facts[k] + '</span></div>';
      });
      pDesc.outerHTML = '<p class="desc" id="pDesc">' + desc + '</p>';
      // Append facts after the description
      var info = document.getElementById('planetInfo');
      var oldFacts = info.querySelector('.facts');
      if (oldFacts) oldFacts.remove();
      var factsDiv = document.createElement('div');
      factsDiv.className = 'facts';
      factsDiv.innerHTML = factsHtml;
      info.appendChild(factsDiv);
    }

    pauseBtn.addEventListener('click', function () {
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ Play' : '⏸ Pause';
    });

    document.addEventListener('langchange', function () {
      if (selectedPlanet) showPlanetInfo(selectedPlanet);
      else showSunInfo();
    });

    showSunInfo();
    step();
  </script>
</body>
</html>
